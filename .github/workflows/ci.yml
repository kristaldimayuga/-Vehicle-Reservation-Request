name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: govfleet
          POSTGRES_USER: govfleet_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govfleet_ci -d govfleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the CI database only; no real secrets.
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key-not-used-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: govfleet
      DB_USER: govfleet_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks (DEBUG off)
        env:
          DJANGO_DEBUG: "False"
        # Fresh random key per run: long and random enough for security.W009.
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: python -m pytest
